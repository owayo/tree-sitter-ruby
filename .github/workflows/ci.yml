name: CI

on:
  push:
    branches: [master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/rust/**
      - Cargo.toml
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/rust/**
      - Cargo.toml

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Set up examples
        run: |
          git clone https://github.com/ruby/spec examples/ruby_spec --single-branch --depth=1 --filter=blob:none
      - name: Build shared library
        shell: bash
        run: |
          mkdir -p /tmp/ts-lib
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            gcc -shared -O0 -static-libgcc -o /tmp/ts-lib/ruby.dll -I src src/parser.c src/scanner.c
            # ネイティブの tree-sitter.exe は POSIX パスをドライブレターの無い
            # root 相対パスとして扱い、カレントドライブ基準 (D:\tmp\ts-lib) に
            # 解決してしまう。Git Bash の /tmp と同じ実体を指す Windows 形式の
            # パスを渡す。
            libdir="$(cygpath -w /tmp/ts-lib)"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cc -shared -fPIC -O0 -o /tmp/ts-lib/ruby.dylib -I src src/parser.c src/scanner.c
            libdir=/tmp/ts-lib
          else
            cc -shared -fPIC -O0 -o /tmp/ts-lib/ruby.so -I src src/parser.c src/scanner.c
            libdir=/tmp/ts-lib
          fi
          ls -l /tmp/ts-lib
          echo "TREE_SITTER_LIBDIR=$libdir" >> "$GITHUB_ENV"
      - name: Verify shared library loads
        shell: bash
        run: |
          # 326 件のコーパステストを回す前に、共有ライブラリを実際にロードできる
          # ことを 1 回のパースで確かめる。失敗時は tree-sitter の Caused by
          # チェーンがそのままログに残る。
          printf 'x = 1\n' > smoke_parse_check.rb
          tree-sitter parse --no-ranges smoke_parse_check.rb
      - name: Run corpus tests
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python3 scripts/corpus_test.py
      - name: Run Rust tests
        if: runner.os != 'Windows'
        shell: bash
        run: cargo test
      - name: Parse examples
        uses: tree-sitter/parse-action@v4
        with:
          files: |
            examples/*.rb
            !examples/ruby_spec/command_line/fixtures/bad_syntax.rb
            !examples/ruby_spec/command_line/fixtures/freeze_flag_required_diff_enc.rb
            !examples/ruby_spec/core/enumerable/shared/inject.rb
            !examples/ruby_spec/language/fixtures/freeze_magic_comment_required_diff_enc.rb
            !examples/ruby_spec/language/string_spec.rb
            !examples/ruby_spec/core/proc/ruby2_keywords_spec.rb
            !examples/ruby_spec/language/fixtures/utf16-be-nobom.rb
            !examples/ruby_spec/language/fixtures/utf16-le-nobom.rb
            !examples/ruby_spec/language/lambda_spec.rb
